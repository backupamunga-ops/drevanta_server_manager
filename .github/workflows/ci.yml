name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: cross-compile linux/amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/drevantad-ci ./cmd/drevantad

      # Advisory scans: report (and surface annotations) without blocking
      # the pipeline — the operator reviews the findings on each run.
      - name: govulncheck
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
        continue-on-error: true

  acme:
    name: "ACME integration — pebble IP-cert issue, renew, proxy"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: map the domain-slot test domain to loopback
        run: echo "127.0.0.1 dashboard.example.test" | sudo tee -a /etc/hosts

      - name: download pebble (Let's Encrypt test ACME server)
        run: |
          mkdir -p /tmp/pebble
          curl -fsSL --retry 3 -o /tmp/pebble/pebble.tgz \
            https://github.com/letsencrypt/pebble/releases/download/v2.10.1/pebble-linux-amd64.tar.gz
          tar -xzf /tmp/pebble/pebble.tgz -C /tmp/pebble
          BIN=$(find /tmp/pebble -type f -name pebble | head -n1)
          cp "$BIN" /tmp/pebble/pebble-bin && chmod +x /tmp/pebble/pebble-bin

      - name: run httpsd integration tests against pebble
        env:
          DREVANTA_PEBBLE_BIN: /tmp/pebble/pebble-bin
        run: go test ./internal/httpsd/ -run 'TestPebble|TestShouldRenew' -v -timeout 300s

  installer:
    name: Installer harness + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: shellcheck deploy scripts
        run: |
          shellcheck deploy/install.sh deploy/rollback.sh deploy/healthgate.sh deploy/drevanta.sh deploy/bootstrap.sh deploy/tests/test_install.sh

      - name: build daemon for the harness
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/drevantad-harness ./cmd/drevantad

      - name: run installer test harness
        run: bash deploy/tests/test_install.sh /tmp/drevantad-harness

  web:
    name: Dashboard typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: svelte-check
        working-directory: web
        run: npm run check

      - name: unit tests (setup-link fragment handling)
        working-directory: web
        run: npm test

      - name: static build
        working-directory: web
        run: npm run build

      - name: npm audit (non-dev dependencies)
        working-directory: web
        run: npm audit --omit=dev --audit-level=high
        continue-on-error: true
