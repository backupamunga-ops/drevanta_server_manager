name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  go:
    name: Go build, vet, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: gofmt check
        run: |
          out="$(gofmt -l .)"
          if [ -n "$out" ]; then
            echo "unformatted files:"
            echo "$out"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: cross-compile linux/amd64
        run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -o /tmp/drevantad-ci ./cmd/drevantad

  installer:
    name: Installer harness + shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: shellcheck deploy scripts
        run: |
          shellcheck deploy/install.sh deploy/rollback.sh deploy/healthgate.sh deploy/drevanta.sh deploy/tests/test_install.sh

      - name: build daemon for the harness
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/drevantad-harness ./cmd/drevantad

      - name: run installer test harness
        run: bash deploy/tests/test_install.sh /tmp/drevantad-harness

  web:
    name: Dashboard typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: npm ci
        working-directory: web
        run: npm ci

      - name: svelte-check
        working-directory: web
        run: npm run check

      - name: unit tests (setup-link fragment handling)
        working-directory: web
        run: npm test

      - name: static build
        working-directory: web
        run: npm run build
